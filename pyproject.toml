[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakradar-cli"
version = "0.1.1"
description = "API Security Reconnaissance & BOLA Evidence Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ajmax76" }]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "reportlab>=3.6.0",
    "cryptography>=41.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
leakradar = "leakradar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
