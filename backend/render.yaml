services:
  - type: web
    name: ajmax76-license-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: POLAR_API_KEY
        sync: false
      - key: POLAR_ORGANIZATION_ID
        sync: false
      - key: JWT_SIGNING_SECRET
        generateValue: true
