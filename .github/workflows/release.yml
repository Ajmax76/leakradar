name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Multi-Platform Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: leakradar-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: leakradar-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: leakradar-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow setuptools
          pip install -e .

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller leakradar.spec

      - name: Archive Binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist/leakradar.exe, README.md -DestinationPath ${{ matrix.artifact_name }}

      - name: Archive Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C dist leakradar README.md

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
