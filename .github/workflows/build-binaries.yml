name: Build Cross-Platform Standalone Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: leakradar-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: leakradar-linux-x86_64
          - os: macos-latest
            artifact_name: leakradar-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Pro submodule (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRO_SUBMODULE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git submodule update --init --recursive
          rm ~/.ssh/deploy_key

      - name: Checkout Pro submodule (Windows)
        if: runner.os == 'Windows'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRO_SUBMODULE_DEPLOY_KEY }}
        shell: powershell
        run: |
          # Write key to temp file with correct permissions
          $keyDir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\ssh" -Force
          $keyPath = "$env:RUNNER_TEMP\ssh\deploy_key"
          [IO.File]::WriteAllText($keyPath, $env:SSH_PRIVATE_KEY)
          # Restrict permissions to current user only (required by OpenSSH)
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "${env:USERNAME}:(R)" | Out-Null
          # Add github.com to known_hosts to avoid interactive prompt
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          ssh-keyscan -t ed25519 github.com 2>$null | Add-Content "$env:USERPROFILE\.ssh\known_hosts"
          # Pull submodule using this key
          $env:GIT_SSH_COMMAND = "ssh -i `"$keyPath`" -o StrictHostKeyChecking=accept-new"
          git submodule update --init --recursive
          Remove-Item $keyPath -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow setuptools reportlab cryptography
          pip install -e .

      - name: Generate Icon (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "from PIL import Image; img=Image.open('assets/logo.png'); img.save('assets/logo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build Binary with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name=leakradar-windows-x64 --icon=assets/logo.ico --hidden-import=leakradar.auth --hidden-import=leakradar.seeder --hidden-import=leakradar.bola_matrix --hidden-import=leakradar.canonicalizer --collect-all=leakradar src/leakradar/cli.py

      - name: Build Binary with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name=${{ matrix.artifact_name }} --hidden-import=leakradar.auth --hidden-import=leakradar.seeder --hidden-import=leakradar.bola_matrix --hidden-import=leakradar.canonicalizer --collect-all=leakradar src/leakradar/cli.py

      - name: Upload Binary Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
