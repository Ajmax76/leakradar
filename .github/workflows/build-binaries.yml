name: Build Cross-Platform Native Binaries with Nuitka

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Nuitka binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target_name: leakradar-windows-amd64.exe
            build_cmd: python -m nuitka --onefile --output-filename=leakradar-windows-amd64.exe src/leakradar/cli.py
          - os: ubuntu-latest
            target_name: leakradar-linux-amd64
            build_cmd: python -m nuitka --onefile --output-filename=leakradar-linux-amd64 src/leakradar/cli.py
          - os: macos-latest
            target_name: leakradar-macos-universal
            build_cmd: python -m nuitka --onefile --output-filename=leakradar-macos-universal src/leakradar/cli.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install . nuitka

      - name: Compile Native Binary with Nuitka
        run: ${{ matrix.build_cmd }}

      - name: Upload Binary Asset to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.target_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
