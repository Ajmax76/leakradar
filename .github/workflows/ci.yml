name: LeakRadar CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e .

      - name: Start VAmPI Test Container
        run: |
          docker run -d -p 5000:5000 --name vampi erezdesel/vampi:latest
          for i in {1..30}; do
            if curl -s http://localhost:5000/ > /dev/null; then
              echo "VAmPI container is online."
              break
            fi
            echo "Waiting for VAmPI..."
            sleep 1
          done

      - name: Run E2E Test Suite
        run: |
          pytest tests/test_vampi_e2e.py -v
