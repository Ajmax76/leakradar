name: LeakRadar CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vampi:
        image: erezdesel/vampi:latest
        ports:
          - 5000:5000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Wait for VAmPI Service
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/ > /dev/null; then
              echo "VAmPI service is online."
              break
            fi
            echo "Waiting for VAmPI..."
            sleep 1
          done

      - name: Run E2E Test Suite
        run: |
          pytest tests/test_vampi_e2e.py -v
